[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ams-flux-server"
version = "0.1.0"
description = "SCP tools for the AMS electron-plus-positron flux demo"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.1,<4",
  "scp @ git+https://github.com/InternScience/scp.git@cea5398564032aea65a78e246d06c30ae945e03f",
  # The SDK imports a Pydantic internal API; use its locked versions.
  "pydantic==2.10.1",
  "pydantic-settings==2.6.1",
]

[project.scripts]
ams-flux-server = "ams_flux_server.server:main"

[tool.setuptools.packages.find]
include = ["ams_flux_server*"]
